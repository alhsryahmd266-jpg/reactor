name: ARM NDK Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip" -O ndk.zip
          ls -lh ndk.zip

      - name: Create Release & Upload
        run: |
          gh release create ndk-r25c --title "NDK r25c" --notes "ARM Agent NDK" || true
          gh release upload ndk-r25c ndk.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
