name: AuraGenesis APK Builder
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: cd flutter_app && flutter pub get
      - name: Build APK
        run: cd flutter_app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "AuraGenesis Build v${{ github.run_number }}"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}