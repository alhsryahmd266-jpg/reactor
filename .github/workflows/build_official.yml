name: Build APK Official
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
      - run: |
          sudo apt-get install -y ecj dx aapt apksigner
          python3 arm_builder/build_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: '*.apk'
